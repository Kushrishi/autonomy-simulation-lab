name: Native replay CI

on:
  push:
    paths:
      - "native/**"
      - ".clang-format"
      - ".github/workflows/native-ci.yml"
  pull_request:
    paths:
      - "native/**"
      - ".clang-format"
      - ".github/workflows/native-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sanitizers: "ON"
            ort: "ON"
          - os: macos-15
            sanitizers: "OFF"
            ort: "ON"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install libpng (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpng-dev

      - name: Install libpng (macOS)
        if: runner.os == 'macOS'
        run: brew install libpng

      - name: Check C++ formatting
        run: |
          python3 -m pip install clang-format==18.1.8
          clang-format --dry-run --Werror native/include/asl/*.hpp native/src/*.cpp native/tests/*.cpp

      - name: Install pinned model-reference test dependency
        run: python3 -m pip install Pillow==12.3.0

      - name: Install pinned ONNX Runtime CPU (Linux)
        if: runner.os == 'Linux'
        run: |
          curl --fail --location --retry 3 -o ort.tgz https://github.com/microsoft/onnxruntime/releases/download/v1.30.0/onnxruntime-linux-x64-1.30.0.tgz
          echo 'a5ed5a3cac51fbb2e90da632ae43d19212faaa20e76484e62bcb7c23ddb3b3fd  ort.tgz' | sha256sum --check
          tar -xzf ort.tgz
          echo "ORT_ROOT=$PWD/onnxruntime-linux-x64-1.30.0" >> "$GITHUB_ENV"

      - name: Install pinned ONNX Runtime CPU (macOS arm64)
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          curl --fail --location --retry 3 -o ort.tgz https://github.com/microsoft/onnxruntime/releases/download/v1.30.0/onnxruntime-osx-arm64-1.30.0.tgz
          echo '6ebb5062a934537c352937821f9fe9718e7de1a2db1122a93dd363ffd53a7012  ort.tgz' | shasum --algorithm 256 --check
          tar -xzf ort.tgz
          echo "ORT_ROOT=$PWD/onnxruntime-osx-arm64-1.30.0" >> "$GITHUB_ENV"

      - name: Configure
        run: >
          cmake -S native -B native/build
          -DCMAKE_BUILD_TYPE=Debug
          -DASL_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
          -DASL_ONNXRUNTIME_ROOT=${{ env.ORT_ROOT }}
          -DASL_BUNDLE_ONNXRUNTIME=ON

      - name: Build
        run: cmake --build native/build --parallel

      - name: Test
        run: ctest --test-dir native/build --output-on-failure

      - name: Validate example manifest
        run: ./native/build/asl-replay validate-manifest native/examples/manifest.tsv

      - name: Verify relocated install without original ONNX Runtime
        run: python3 native/tests/test_installed_bundle.py native/build "$ORT_ROOT"
